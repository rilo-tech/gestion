<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>RILO — Registrá ventas y pedidos por WhatsApp</title>
    <meta
      name="description"
      content="Cargás hablando. Controlás en pantalla. Registrá ventas, pedidos y cobros escribiéndole a RILO por WhatsApp. Probá gratis sin tarjeta."
    />
    <meta property="og:title" content="RILO — Registrá ventas y pedidos por WhatsApp" />
    <meta
      property="og:description"
      content="Escribile a RILO como hablás. Él organiza la información de tu negocio. Cargás hablando. Controlás en pantalla."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_UY" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var dark = false;
          for (var i = 0; i < localStorage.length; i++) {
            var key = localStorage.key(i);
            if (key && key.indexOf('rilo-user-theme') === 0 && localStorage.getItem(key) === 'dark') {
              dark = true;
              break;
            }
          }
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#6b7280;background:#030712;">
        Cargando RILO…
      </div>
    </app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
